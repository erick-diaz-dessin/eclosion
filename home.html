<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <title>HomePage - Eclosion</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="settings.css" />
  <link rel="stylesheet" href="home.css" />

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    // Configuración Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBlW88Ij6xN4HLgrmjMDnB-Ah3_AN3Zl5Q",
      authDomain: "eclosion-f61c8.firebaseapp.com",
      projectId: "eclosion-f61c8",
      storageBucket: "eclosion-f61c8.firebasestorage.app",
      messagingSenderId: "933129070472",
      appId: "1:933129070472:web:498ba567b3c0f7ff9fbc3d",
      measurementId: "G-CXTMXLB421"
    };

    // Inicializar Firebase y Firestore
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables globales para nombre y email
    window.nombreReal = "";
    window.email = "";

    // Obtener parámetros URL
    function getParam(key) {
      const params = new URLSearchParams(window.location.search);
      return params.get(key);
    }

    window.addEventListener("DOMContentLoaded", async () => {
      window.nombreReal = getParam("nombre");
      window.email = getParam("email");

      if (!window.nombreReal || !window.email) return;

      const userRef = doc(db, "users", window.email);
      const userSnap = await getDoc(userRef);

      if (userSnap.exists()) {
        const data = userSnap.data();

        // Saludo con nombre
        document.getElementById("welcome").textContent = `Salut, ${window.nombreReal}!`;

        // Mostrar avatar si existe
        const avatarUrl = data.avatar || "";
        if (avatarUrl) {
          const avatarImg = document.createElement("img");
          avatarImg.src = avatarUrl;
          avatarImg.alt = "Avatar";
          avatarImg.width = 150;
          avatarImg.height = 150;
          avatarImg.style.borderRadius = "50%";
          avatarImg.style.marginTop = "10px";
          document.getElementById("avatarContainer").appendChild(avatarImg);
        }

        // Mostrar centros de interés
        const interests = data.interests || [];
        if (interests.length > 0) {
          const ul = document.createElement("ul");
          interests.forEach(i => {
            const li = document.createElement("li");
            li.textContent = i;
            ul.appendChild(li);
          });
          const interestsDiv = document.getElementById("interestsContainer");
          interestsDiv.innerHTML = "<h3>Centros de interés:</h3>";
          interestsDiv.appendChild(ul);
        }

      } else {
        // Si no existe, redirigir a settings.html con nombre y email
        const query = `?nombre=${encodeURIComponent(window.nombreReal)}&email=${encodeURIComponent(window.email)}`;
        window.location.href = `settings.html${query}`;
      }
    });
  </script>
  
</head>
<body>
  <header>
    <h1> Comment te sens-tu aujourd'hui ?</h1>
  </header>

  <main class="avatarMarco">
    <div>
      <p id="welcome">Loading...</p>

      <div class="profilContainer">
        <div id="avatarContainer" style="width: 300px;"></div>
        <div id="interestsContainer" style="width: 300px;"></div>
      </div>

      <div class="slider-container">
        <span class="emoji">😞</span>
        <input type="range" id="moodSlider" min="1" max="10" value="5" />
        <span class="emoji">😄</span>
      </div>

      <div class="text-input-container">
        <label for="moodComment">Parle-nous un peu à ce sujet :</label><br />
        <input id="moodComment" type="text" />
      </div>

      <div id="buttonsContainer">
        <!-- Botones con íconos -->
        <button id="btnVoz"><i class="fas fa-microphone"></i></button>
        <button id="btnTexto"><i class="fas fa-comment-dots"></i></button>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Eclosion. Tous droits réservés.</p>
  </footer>

  <script>
    // Usar las variables globales para redirección
    document.getElementById("btnVoz").addEventListener("click", () => {
      if (window.nombreReal && window.email) {
        window.location.href = `rooms-text.html?nombre=${encodeURIComponent(window.nombreReal)}&email=${encodeURIComponent(window.email)}`;
      }
    });

    document.getElementById("btnTexto").addEventListener("click", () => {
      if (window.nombreReal && window.email) {
        window.location.href = `rooms-text.html?nombre=${encodeURIComponent(window.nombreReal)}&email=${encodeURIComponent(window.email)}`;
      }
    });

    // Crisp Chat
    window.$crisp = [];
    window.CRISP_WEBSITE_ID = "85c412e8-b55f-4cdf-9de5-6831030ddfa9";
    (function () {
      d = document;
      s = d.createElement("script");
      s.src = "https://client.crisp.chat/l.js";
      s.async = 1;
      d.getElementsByTagName("head")[0].appendChild(s);
    })();
  </script>
</body>
</html>
