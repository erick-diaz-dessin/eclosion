<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-signin-client_id" content="1094789566691-cveqvjnlo4d4rdtrtjqk32vet8q63ccv.apps.googleusercontent.com" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jwt-decode@4.0.0/build/cjs/index.min.js"></script>
  <title>Eclosion - Réseau Social Empathique</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    #loginForm {
      display: none;
      margin-top: 2rem;
      max-width: 300px;
    }
    #loginForm input {
      display: block;
      width: 100%;
      margin-bottom: 1rem;
      padding: 0.5rem;
      font-size: 1rem;
    }
    #loginForm button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Logo" />
  </header>

  <div class="cta">
    <button onclick="handleJoin()" style="margin-top: 8rem;">Connexion avec e-mail</button>
  </div>

  <div id="formContainer">
    <form id="loginForm">
      <input type="text" id="usuario" name="usuario" placeholder="Utilisateur" required />
      <input type="password" id="contrasena" name="contrasena" placeholder="Mot de passe" required />
      <button type="submit">Se connecter</button>
      <button type="button" onclick="crearCuenta()">Créer un compte</button>
    </form>
  </div><br>

  <div id="fb-root"></div>

  <div id="facebookLogin">
    <fb:login-button 
      scope="public_profile,email" 
      onlogin="checkLoginState();" 
      size="large"
      layout="rounded"
      width="500">
    </fb:login-button>
  </div>
  
  <div id="status"></div>

  <footer>
    <p>© 2025 Eclosion. Tous droits réservés.</p>
    <p>« Parfois, nous n'avons pas besoin de solutions. Juste quelqu'un pour être là. »</p>
  </footer>

  <script>
    // Mostrar formulario
    function handleJoin() {
      const form = document.getElementById('loginForm');
      form.style.display = form.style.display === 'none' || form.style.display === '' ? 'block' : 'none';
    }

    // Facebook SDK
    window.fbAsyncInit = function () {
      FB.init({
        appId: '1217250413239294',
        cookie: true,
        xfbml: true,
        version: 'v19.0'
      });

      FB.getLoginStatus(function (response) {
        statusChangeCallback(response);
      });
    };

    (function (d, s, id) {
      var js, fjs = d.getElementsByTagName(s)[0];
      if (d.getElementById(id)) return;
      js = d.createElement(s); js.id = id;
      js.src = "https://connect.facebook.net/en_US/sdk.js";
      fjs.parentNode.insertBefore(js, fjs);
    })(document, 'script', 'facebook-jssdk');

    function statusChangeCallback(response) {
      if (response.status === 'connected') {
        FB.api('/me', { fields: 'name,email' }, function (user) {
          const nombre = encodeURIComponent(user.name);
          const email = encodeURIComponent(user.email);
          window.location.href = `home.html?nombre=${nombre}&email=${email}`;
        });
      } else {
        document.getElementById('status').innerHTML = 'Connexion avec Facebook';
      }
    }

    function checkLoginState() {
      FB.getLoginStatus(function (response) {
        statusChangeCallback(response);
      });
    }

    // 🔥 Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBlW88Ij6xN4HLgrmjMDnB-Ah3_AN3Zl5Q",
      authDomain: "eclosion-f61c8.firebaseapp.com",
      projectId: "eclosion-f61c8",
      storageBucket: "eclosion-f61c8.firebasestorage.app",
      messagingSenderId: "933129070472",
      appId: "1:933129070472:web:498ba567b3c0f7ff9fbc3d",
      measurementId: "G-CXTMXLB421"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 🔐 Inicio de sesión con usuario/contraseña
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const pseudo = document.getElementById("usuario").value.trim();
      const pass = document.getElementById("contrasena").value.trim();

      try {
        const query = await db.collection("userssite").where("email", "==", pseudo).get();
        
        if (query.empty) {
          alert("Utilisateur non trouvé.");
          return;
        }

        let userFound = false;

        query.forEach((doc) => {
          const user = doc.data();
          if (user.pass === pass) {
            userFound = true;
            const nombre = encodeURIComponent(user.nombre);
            const email = encodeURIComponent(user.email);
            window.location.href = `home.html?nombre=${nombre}&email=${email}`;
          }
        });

        if (!userFound) {
          alert("Mot de passe incorrect.");
        }
      } catch (error) {
        console.error("Erreur de connexion :", error);
        alert("Erreur lors de la tentative de connexion.");
      }
    });

    function crearCuenta() {
  const email = document.getElementById("usuario").value.trim();
  const pass = document.getElementById("contrasena").value.trim();

  if (!email || !pass) {
    alert("Veuillez entrer l'e-mail et le mot de passe avant de créer un compte.");
    return;
  }

  const url = `settingssite.html?email=${encodeURIComponent(email)}&pass=${encodeURIComponent(pass)}`;
  window.location.href = url;
}

  </script>
</body>
</html>
